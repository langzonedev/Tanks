name: Verify and publish Tanks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tanks-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - name: Install isolated Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tanks-tools" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/tanks-tools/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Verify local, touch and shared turns
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tanks-tools/node_modules/playwright
        run: node tests/browser-smoke.cjs
      - name: Package public app
        run: |
          mkdir _site
          cp index.html style.css icon.svg app.js engine.js renderer.js session.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
